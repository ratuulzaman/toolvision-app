<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Real-Time Tool Detection APP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #060D1A;
      background-image:
        radial-gradient(ellipse 600px 400px at 10% 20%, rgba(0,119,168,0.3) 0%, transparent 70%),
        radial-gradient(ellipse 500px 350px at 90% 80%, rgba(0,200,150,0.2) 0%, transparent 70%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 20px;
    }
    .card {
      background: rgba(17,34,51,0.95);
      border: 0.5px solid #1E3A55;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%; max-width: 380px;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px; border-radius: 20px;
      background: linear-gradient(135deg, #0077A8, #00C896);
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin: 0 auto 20px;
    }
    h1 { font-size: 20px; font-weight: 500; color: #00B4D8; margin-bottom: 8px; }
    p  { font-size: 13px; color: #6B8FA8; line-height: 1.6; margin-bottom: 24px; }
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid #1E3A55;
      border-top-color: #00B4D8;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #6B8FA8; }
    .open-btn {
      display: block; width: 100%;
      background: linear-gradient(135deg, #0077A8, #00B4D8);
      color: #fff; font-size: 15px; font-weight: 500;
      padding: 14px; border-radius: 12px;
      text-decoration: none; margin-top: 20px;
      transition: opacity 0.2s;
    }
    .open-btn:hover { opacity: 0.85; }
    .note {
      font-size: 11px; color: #6B8FA8; line-height: 1.5;
      background: rgba(0,180,216,0.06);
      border-radius: 8px; padding: 10px 12px; margin-top: 16px;
    }
    .note code { color: #00B4D8; font-family: monospace; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚙</div>
    <h1>Real-Time Tool Detection APP</h1>
    <p>ENG30002 · Group 5<br>Redirecting to Control Panel…</p>
    <div class="spinner"></div>
    <div class="status" id="status">Connecting…</div>
    <a class="open-btn" id="open-btn" href="#" style="display:none">Open Control Panel →</a>
    <div class="note">
      Update <code>CONTROL_URL</code> each session when your ngrok URL changes.
    </div>
  </div>

<script>
  const CONTROL_URL = "https://armrest-unreached-cavalry.ngrok-free.dev/control";

  const btn    = document.getElementById("open-btn");
  const status = document.getElementById("status");

  btn.href           = CONTROL_URL;
  btn.style.display  = "block";
  status.textContent = "Redirecting in 2 seconds…";
  setTimeout(() => { window.location.href = CONTROL_URL; }, 2000);
</script>
</body>
</html>
